<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
  </head>
  <body>
    <form 
      id="my-form"
      method="POST" 
      action="https://script.google.com/macros/s/AKfycbyOnevfI1umsmRAFQ0KOwHb4B5Z54ZDynMfGtkbtZQG7V1XQFSfAOKmxyK2aeiJTgFCyw/exec">
      <input name="Email" type="email" placeholder="Email" required>
      <input name="Name" type="text" placeholder="Name" required>
      <button type="submit">Send</button>
    </form>

    <script>
      window.addEventListener("load", function() {
        const form = document.getElementById('my-form');
        
        form.addEventListener('submit', function(e) {
          e.preventDefault(); // Stops the page from redirecting
          
          const data = new FormData(form);
          const action = e.target.action;
          
          fetch(action, {
            method: 'POST',
            body: data,
            mode: 'no-cors' // Forces background submission
          })
          .then(() => {
            alert("Success!");
            form.reset(); // Clears the inputs
          })
          .catch(error => {
            console.error('Error!', error);
            alert("Something went wrong.");
          });
        });
      });
    </script>
  </body>
</html>
