<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
  </head>
  <body>
    <form id="form" action="https://script.google.com/macros/s/AKfycbyOnevfI1umsmRAFQ0KOwHb4B5Z54ZDynMfGtkbtZQG7V1XQFSfAOKmxyK2aeiJTgFCyw/exec" method="POST">
      <!-- Name -->
      <div class="form-control">
          <label for="name">Name</label>
          <input type="text" id="name" name="Name" placeholder="Enter your name" required />
      </div>
      <!-- Email -->
      <div class="form-control">
          <label for="email">Email</label>
          <input type="email" id="email" name="Email" placeholder="Enter your email" required />
      </div>
      <!-- Age -->
      <div class="form-control">
          <label for="age">Age</label>
          <input type="text" id="age" name="Age" placeholder="Enter your age" />
      </div>
      <!-- Role -->
      <div class="form-control">
          <label for="role">Which option best describes you?</label>
          <select name="Role" id="role">
              <option value="student">Student</option>
              <option value="intern">Intern</option>
              <option value="professional">Professional</option>
              <option value="other">Other</option>
          </select>
      </div>
      <!-- Recommendation -->
      <div class="form-control">
          <label>Would you recommend GeeksforGeeks to a friend?</label>
          <label><input type="radio" name="Recommend" value="Yes">Yes</label>
          <label><input type="radio" name="Recommend" value="No">No</label>
          <label><input type="radio" name="Recommend" value="Maybe">Maybe</label>
      </div>
      <!-- Checkboxes -->
      <div class="form-control">
          <label>Languages and Frameworks known</label>
          <label><input type="checkbox" name="Languages" value="C">C</label>
          <label><input type="checkbox" name="Languages" value="C++">C++</label>
          <label><input type="checkbox" name="Languages" value="Java">Java</label>
          <label><input type="checkbox" name="Languages" value="Python">Python</label>
          <label><input type="checkbox" name="Languages" value="JavaScript">JavaScript</label>
      </div>
      <!-- Comment -->
      <div class="form-control">
          <label for="comment">Any comments or suggestions</label>
          <textarea name="Comment" id="comment" placeholder="Enter your comment here"></textarea>
      </div>
      <button type="submit">Submit</button>
    </form>

    <!-- Single, clean script to handle background submission -->
    <script>
      window.addEventListener("load", function() {
        const form = document.getElementById('form');
        
        form.addEventListener('submit', function(e) {
          e.preventDefault(); // Stops the page from redirecting
          
          const data = new FormData(form);
          const action = e.target.action;
          
          fetch(action, {
            method: 'POST',
            body: data,
            mode: 'no-cors' // Forces background submission without CORS errors
          })
          .then(() => {
            alert("Success!");
            form.reset(); // Clears the inputs
          })
          .catch(error => {
            console.error('Error!', error);
            alert("Something went wrong.");
          });
        });
      });
    </script>
  </body>
</html>
