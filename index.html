<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
  </head>
  <body>
    <form 
      id="my-form"
      method="POST" 
      action="https://script.google.com/macros/s/AKfycbyOnevfI1umsmRAFQ0KOwHb4B5Z54ZDynMfGtkbtZQG7V1XQFSfAOKmxyK2aeiJTgFCyw/exec">
      <input name="Email" type="email" placeholder="Email" required>
      <input name="Name" type="text" placeholder="Name" required>
      <button type="submit">Send</button>
    </form>

    <script>
      const form = document.getElementById('my-form');

      form.addEventListener('submit', e => {
        e.preventDefault();
        
        fetch(form.action, { 
          method: 'POST', 
          body: new FormData(form),
          mode: 'no-cors' // Prevents page redirect and handles cross-origin submission
        })
        .then(() => {
          alert("Success!");
          form.reset(); // Clears the input fields after sending
        })
        .catch(error => {
          console.error('Error!', error.message);
          alert("There was an error submitting the form.");
        });
      });
    </script>
  </body>
</html>
